<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Working Day Calculator</title>

<style>
body {
    margin:0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #0d47a1, #1976d2);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container {
    background:#ffffff;
    width:420px;
    padding:25px 30px;
    border-radius:8px;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

.header {
    display:flex;
    align-items:center;
    margin-bottom:20px;
    border-bottom:2px solid #1976d2;
    padding-bottom:10px;
}

.header img {
    height:55px;
    margin-right:12px;
}

.header-text h2 {
    margin:0;
    color:#1976d2;
    font-size:18px;
}

.header-text h3 {
    margin:0;
    font-size:14px;
    color:#0d47a1;
}

.title {
    text-align:center;
    font-weight:600;
    margin-bottom:15px;
}

.row {
    display:flex;
    align-items:center;
    margin-bottom:12px;
}

label {
    width:120px;
    font-weight:600;
    font-size:14px;
}

input {
    flex:1;
    padding:6px 8px;
    border:1px solid #ccc;
    border-radius:4px;
}

button {
    padding:6px 10px;
    margin-left:6px;
    font-size:13px;
    background:#1976d2;
    color:white;
    border:none;
    border-radius:4px;
    cursor:pointer;
}

button:hover {
    background:#0d47a1;
}

#copyMessage {
    display:none;
    color:#0a7a28;
    font-size:13px;
    font-weight:600;
    margin-top:8px;
    text-align:center;
}

#errorMessage {
    display:none;
    background:#ffe6e6;
    color:#b30000;
    padding:6px;
    font-size:13px;
    margin-bottom:10px;
    border-radius:4px;
}
</style>
</head>

<body>

<div class="container">

    <div id="errorMessage"></div>

    <div class="header">
        <img src="wbsedcl_logo.png">
        <div class="header-text">
            <h2>WBSEDCL</h2>
            <h3>Procurement & Contract Dept.</h3>
        </div>
    </div>

    <div class="title">Working Day Calculator</div>

    <div class="row">
        <label>Input Date</label>
        <input type="date" id="startDate">
    </div>

    <div class="row">
        <label>Working Days</label>
        <input type="number" id="workingDays">
    </div>

    <div class="row">
        <label>Final Date</label>
        <input type="text" id="result" readonly>
        <button onclick="copyResult()">Copy</button>
    </div>

    <div id="copyMessage">Date copied successfully.</div>

</div>

<script>
let holidays = [];
let holidayLoaded = false;

// Load CSV file
fetch("holidays.csv")
.then(response => {
    if (!response.ok) {
        throw new Error("CSV not found");
    }
    return response.text();
})
.then(text => {
    let rows = text.split("\n");
    rows.shift(); // remove header

    rows.forEach(row => {
        let date = row.trim();
        if (date !== "") {
            holidays.push(date);
        }
    });

    holidayLoaded = true;
})
.catch(error => {
    showError("⚠ Unable to load holiday CSV file. Only weekends will be excluded.");
});

function calculateDate() {

    let startValue = document.getElementById("startDate").value;
    let daysValue = document.getElementById("workingDays").value;

    if (!startValue || !daysValue) return;

    let startDate = new Date(startValue);
    let daysToAdd = parseInt(daysValue)-1;

    let count = 0;

    while (count < daysToAdd) {
        startDate.setDate(startDate.getDate() + 1);

        let day = startDate.getDay();
        let formatted = formatDate(startDate);

        if (day !== 0 && day !== 6 && (!holidayLoaded || !holidays.includes(formatted))) {
            count++;
        }
    }

    document.getElementById("result").value = formatDate(startDate);
}

function formatDate(date) {
    let dd = String(date.getDate()).padStart(2, '0');
    let mm = String(date.getMonth() + 1).padStart(2, '0');
    let yyyy = date.getFullYear();
    return dd + "-" + mm + "-" + yyyy;
}

document.getElementById("startDate").addEventListener("input", calculateDate);
document.getElementById("workingDays").addEventListener("input", calculateDate);

function copyResult() {
    let result = document.getElementById("result").value;
    if (!result) return;

    navigator.clipboard.writeText(result);

    let msg = document.getElementById("copyMessage");
    msg.style.display = "block";

    setTimeout(() => {
        msg.style.display = "none";
    }, 2000);
}

function showError(message) {
    let box = document.getElementById("errorMessage");
    box.innerHTML = message;
    box.style.display = "block";
}
</script>

</body>
</html>
